<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/form.css">
      <link rel="shortcut icon" sizes="180x180" href="./img/l.jpeg">
    <script defer src="js/formula.js"></script>
    <title>Digital Parts – Registro</title>
</head>

<body>

    <div class="card">

        <div class="logo">
            <h1>⚙ Parts Digital</h1>
            <p>Sistema de gestión de partes</p>
        </div>

        <h2>Crear cuenta</h2>
        <p class="subtitulo">Completa los datos para registrarte</p>

        <form action="formulario.php" method="POST">

            <div class="campo">
                <label for="firstName">Nombre completo</label>
                <input type="text" id="firstName" name="firstName" placeholder="Ej: Juan Pérez" required>
                <span class="error-msg" id="errNombre">Ingresa tu nombre completo.</span>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@email.com" required>
                <span class="error-msg" id="errCorreo">Ingresa un correo válido.</span>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="contrasena" placeholder="Mínimo 6 caracteres" required>
                <span class="mostrar-pass" id="togglePass">👁 Ver</span>
                <div class="fuerza-pass">
                    <div class="fuerza-barra" id="fuerzaBarra"></div>
                </div>
                <div class="fuerza-texto" id="fuerzaTexto"></div>
                <span class="error-msg" id="errPass">Mínimo 6 caracteres.</span>
            </div>

            <!-- BOTÓN CORREGIDO -->
            <button type="submit" id="btnEnviar">Crear cuenta →</button>

            <div class="spinner" id="spinner"></div>

        </form>

        <div class="alerta" id="alerta"></div>

        <hr class="linea">
        <p class="footer">© 2026 Parts Digital. Todos los derechos reservados.</p>

    </div>

</body>

</html>
